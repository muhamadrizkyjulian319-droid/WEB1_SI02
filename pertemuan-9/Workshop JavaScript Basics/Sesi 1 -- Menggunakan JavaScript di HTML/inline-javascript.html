<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline JavaScript</title>
</head>
<body>
    <!-- Tombol dengan onclick -->
    <button onclick="alert('Halo, saya belajar JavaScript!')">Klik Saya</button>

    <!-- Tambahan: tombol dengan onmouseover -->
    <button onmouseover="alert('Mouse sedang di atas tombol!')">Hover Saya</button>

    <!-- Tambahan: tombol dengan ondblclick -->
    <button ondblclick="alert('Tombol diklik dua kali!')">Double Klik Saya</button>
</body>
</html>
