<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Output</title>
</head>
<body>
    <h1>Latihan Output JavaScript</h1>

    <!-- 2.1 innerHTML -->
    <p id="demo"></p>

    <script>
        // innerHTML
        document.getElementById("demo").innerHTML = "Output dengan innerHTML!";

        // 2.2 alert()
        alert("Halo dari alert!");

        // 2.3 console.log()
        console.log("Pesan ini muncul di console");

        // 2.4 document.write()
        document.write("<p>Ini ditulis dengan document.write()</p>");
    </script>    
</body>
</html>
