<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery Effects dengan Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-5">

  <div class="container text-center">
    <p id="box" class="p-3 bg-light border">Ini adalah paragraf efek jQuery.</p>

    <div class="mt-3">
      <button id="fadeOut" class="btn btn-danger me-2">Fade Out</button>
      <button id="fadeIn" class="btn btn-success me-2">Fade In</button>
      <button id="slideUp" class="btn btn-warning me-2">Slide Up</button>
      <button id="slideDown" class="btn btn-primary">Slide Down</button>
    </div>
  </div>

  <!-- jQuery harus dimuat dulu -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(function () {
      $("#fadeOut").click(() => $("#box").fadeOut());
      $("#fadeIn").click(() => $("#box").fadeIn());
      $("#slideUp").click(() => $("#box").slideUp());
      $("#slideDown").click(() => $("#box").slideDown());
    });
  </script>
</body>
</html>
