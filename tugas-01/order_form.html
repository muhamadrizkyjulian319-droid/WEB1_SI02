<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .order-form {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            margin-bottom: 10px;
        }

        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .form-group {
            flex: 1;
        }

        .small-input {
            max-width: 100px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        .terms {
            margin-bottom: 15px;
        }

        button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <form class="order-form">
        <h2>Order Form</h2>

        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe">

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
            </div>
        </div>

        <h3>Order Details</h3>

        <div class="form-row">
            <div class="form-group">
                <label for="product">Product</label>
                <select id="product" name="product">
                    <option>Select a product</option>
                    <option>Product A</option>
                    <option>Product B</option>
                    <option>Product C</option>
                </select>
            </div>
            <div class="form-group small-input">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">
            </div>
        </div>

        <label>Size</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="size" value="Small"> Small</label>
            <label><input type="checkbox" name="size" value="Medium"> Medium</label>
            <label><input type="checkbox" name="size" value="Large"> Large</label>
            <label><input type="checkbox" name="size" value="XL"> XL</label>
        </div>

        <label>Color</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="color" value="Red"> Red</label>
            <label><input type="checkbox" name="color" value="Green"> Green</label>
            <label><input type="checkbox" name="color" value="Blue"> Blue</label>
            <label><input type="checkbox" name="color" value="Black"> Black</label>
        </div>

        <label for="comments">Additional Comments</label>
        <textarea id="comments" name="comments" placeholder="Enter any additional comments or instructions"></textarea>

        <h3>Payment Details</h3>

        <label for="payment">Payment Method</label>
        <select id="payment" name="payment">
            <option>Select a payment method</option>
            <option>Credit Card</option>
            <option>PayPal</option>
            <option>Bank Transfer</option>
        </select>

        <div class="terms">
            <label><input type="checkbox" name="terms"> I accept the terms and conditions.</label>
        </div>

        <button type="submit">Submit Order</button>
    </form>
</body>
</html>
