<!DOCTYPE html>
<html lang="en">
<head>
    <title>CS</title>
    <!-- internal css -->
     <style>
        p {
            color: red;
            font-size: 16px;
            font-weight: bold;
        }
        body {
            /* background-color: lightgrey; */
            background: linear-gradient(yellow, blue, red)
        }
        h1, h2 {
            color: blue;
            text-align: center;
        }
        .tulis1 {
            color: purple;
            font-size: 20px;

            font-style: italic;
        }
        #tulis2 {
            color: green;
            font-size: 7px;

        }

            a { text-decoration: none; }
            a:link { color: blue; }
            a:visited { color: purple; }
            a:hover { color: red; }

        }
        p::first-letter {
        font-size: 2em;
        }
     </style>
