<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image - Tag Picture</title>
    <!-- Menerapkan teknik memilih gambar berbeda sesuai ukuran layar. -->
</head>
<body>
    <h2>Responsive Image</h2>
    <picture>
        <source media="(max-width: 600px)" srcset="asset/images.jpg" />
        <source media="(max-width: 601px)" srcset="asset/Logo STT-NF.png" />
        <img src="asset/map_chart_850c.png" alt="Picture Element Example" style="width: 100%;" />
    </picture>
</body>
</html>
