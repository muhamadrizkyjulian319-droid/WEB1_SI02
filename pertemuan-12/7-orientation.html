<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientation Query</title>
    <!-- Memahami media query berdasarkan orientasi layar (portrait/landscape). -->
    <style>
        body {
            text-align: center;
        }
        @media (orientation: lanscape) {
            body {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="item">Box 1</div>
    <div class="item">Box 2</div>
    <div class="item">Box 3</div>
</body>
</html>
